<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Article | VOC Research World</title><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><section class="content"><article class="wrap article" id="article"></article></section><div id="footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const a=article(new URLSearchParams(location.search).get('id')||'metabolism'); const au=author(a.authorId); const pr=project(a.projectId);
document.title=a.title+' | VOC Research World';
const refs=a.references.map(id=>referenceItem(VOC.references[id])).join('');
function referenceItem(r){return `<li>${esc(r.authors)} (${r.year}). <i>${esc(r.title)}</i>. ${esc(r.source)}</li>`;}
document.getElementById('article').innerHTML=`<div class="meta">${esc(a.category)} · ${esc(a.type)} · ${esc(a.date.slice(0,4))}</div><h1>${esc(a.title)}</h1><p><a href="author.html?id=${encodeURIComponent(au.id)}"><b>${esc(au.name)}</b></a> · ${esc(au.affiliation)}</p><p class="lead">${esc(a.subtitle)}</p><div class="abstract"><b>Abstract</b><p>${esc(a.sections[0][1])}</p></div>${a.sections.slice(1).map(s=>`<h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>`).join('')}<h2>Research project</h2><p>This article is connected to <a href="project.html?id=${encodeURIComponent(pr.id)}"><b>${esc(pr.title)}</b></a>.</p><h2>Keywords</h2><p>${a.keywords.map(k=>`<span class="pill">${esc(k)}</span>`).join(' ')}</p><h2>References</h2><ol>${refs}</ol><h2>Related articles</h2><div class="cards three">${a.related.map(id=>articleCard(article(id))).join('')}</div><p><a class="btn primary" href="knowledge.html">← Back to Knowledge Hub</a></p>`;
</script></body></html>
