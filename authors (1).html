<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="VOC Research World author profiles and research contributions."><title>Authors | VOC Research World</title><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><section class="page"><div class="wrap"><p class="eyebrow">RESEARCHERS</p><h1>People behind the science.</h1><p>Professional scientific profiles connected to articles, research projects and publications.</p></div></section><section class="content"><div class="wrap cards three" id="authorsGrid"></div></section><div id="footer"></div><script src="data.js"></script><script src="app.js"></script><script>document.getElementById('authorsGrid').innerHTML=Object.values(VOC_AUTHORS).map(a=>`<article><div class="meta">${esc(a.role)}</div><h3>${esc(a.name)}</h3><p>${esc(a.bio)}</p><p><b>Research interests</b><br>${a.interests.map(esc).join(' · ')}</p><a href="author.html?id=${encodeURIComponent(a.id)}">View profile →</a></article>`).join('');</script></body></html>
