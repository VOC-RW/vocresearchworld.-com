<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Author Dashboard | VOC Research World</title>
<link rel="stylesheet" href="style.css">

<style>
.dash-wrap {
  max-width: 1050px;
  margin: 42px auto;
  padding: 0 18px;
}

.dash-card {
  background: #fff;
  border: 1px solid #dfe5ec;
  border-radius: 14px;
  padding: 22px;
  margin: 18px 0;
  overflow-x: auto;
}

.submission-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

.submission-table th,
.submission-table td {
  text-align: left;
  border-bottom: 1px solid #e5eaf0;
  padding: 12px 10px;
  vertical-align: top;
}

.pill {
  display: inline-block;
  border-radius: 999px;
  background: #eaf2ff;
  padding: 5px 10px;
  font-size: .85rem;
  text-transform: capitalize;
}

.dash-status {
  padding: 12px;
  border-radius: 10px;
  background: #f2f6fb;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.dash-status.error {
  background: #fff0f0;
  color: #8b1b1b;
}

.dash-empty {
  padding: 20px 0;
  color: #526173;
}

.dash-loading {
  padding: 20px 0;
}

@media (max-width: 600px) {
  .dash-wrap {
    margin: 25px auto;
    padding: 0 12px;
  }

  .dash-card {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div id="header"></div>

<main class="dash-wrap">

  <p class="eyebrow">AUTHOR PORTAL</p>

  <h1>My submissions</h1>

  <p>
    View the research manuscripts you have submitted
    and check their editorial status.
  </p>

  <section class="dash-card">

    <div
      id="dashStatus"
      class="dash-status"
      role="status"
      aria-live="polite"
    >
      Checking your account...
    </div>

    <p style="margin-top:16px">
      <a class="btn primary" href="submit.html">
        Submit new research
      </a>

      <button
        id="signOut"
        class="btn secondary"
        type="button"
      >
        Log out
      </button>
    </p>

  </section>

  <section class="dash-card">

    <h2>Submission history</h2>

    <div id="tableWrap">
      <p class="dash-loading">Loading submissions...</p>
    </div>

  </section>

</main>

<div id="footer"></div>

<script src="app.js"></script>

<script type="module">

import { supabase } from "./supabase-config.js";

const statusBox = document.querySelector("#dashStatus");
const tableWrap = document.querySelector("#tableWrap");
const signOutButton = document.querySelector("#signOut");

/* Safely display text from the database. */
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

/* Display account or database messages. */
function showStatus(message, isError = false) {
  statusBox.textContent = message;

  statusBox.className =
    "dash-status" + (isError ? " error" : "");
}

/* Format a date safely. */
function formatDate(value) {
  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return date.toLocaleDateString();
}

/* Format the submission status. */
function formatStatus(value) {
  return String(value || "submitted")
    .replaceAll("_", " ");
}

/* Load the signed-in author's submissions. */
async function loadDashboard() {
  try {
    const {
      data: { session },
      error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    if (!session) {
      showStatus(
        "You are not logged in. Redirecting to account access..."
      );

      tableWrap.innerHTML = "";

      setTimeout(() => {
        window.location.href = "auth.html";
      }, 1000);

      return;
    }

    showStatus("Signed in as " + session.user.email);

    /*
      IMPORTANT:
      The database column is reviewer_notes,
      with an 's' at the end.
    */
    const {
      data,
      error
    } = await supabase
      .from("submissions")
      .select(`
        id,
        title,
        status,
        submission_reference,
        submission_type,
        submitted_at,
        created_at,
        reviewer_notes
      `)
      .eq("submitted_by", session.user.id)
      .order("created_at", { ascending: false });

    if (error) {
      throw error;
    }

    if (!data || data.length === 0) {
      tableWrap.innerHTML = `
        <div class="dash-empty">
          <p>You have not submitted any manuscripts yet.</p>
          <p>
            Use the "Submit new research" button above
            to begin a submission.
          </p>
        </div>
      `;

      return;
    }

    const rows = data.map(row => {
      const reference =
        row.submission_reference ||
        (row.id ? row.id.slice(0, 8) : "—");

      const submissionDate =
        row.submitted_at || row.created_at;

      const editorialNote =
        row.reviewer_notes || "No note yet";

      return `
        <tr>
          <td>${escapeHtml(reference)}</td>

          <td>${escapeHtml(row.title || "Untitled")}</td>

          <td>${escapeHtml(row.submission_type || "—")}</td>

          <td>
            <span class="pill">
              ${escapeHtml(formatStatus(row.status))}
            </span>
          </td>

          <td>${escapeHtml(formatDate(submissionDate))}</td>

          <td>${escapeHtml(editorialNote)}</td>
        </tr>
      `;
    }).join("");

    tableWrap.innerHTML = `
      <table class="submission-table">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Title</th>
            <th>Type</th>
            <th>Status</th>
            <th>Submitted</th>
            <th>Editorial note</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>
      </table>
    `;

  } catch (error) {
    console.error("Dashboard loading error:", error);

    showStatus(
      "Unable to load your submissions. " +
      (error.message || "An unexpected error occurred."),
      true
    );

    tableWrap.innerHTML = `
      <p>
        Please check your internet connection and try again.
        If the problem continues, the database configuration
        may need attention.
      </p>
    `;
  }
}

/* Log the author out. */
signOutButton.addEventListener("click", async () => {
  signOutButton.disabled = true;
  signOutButton.textContent = "Logging out...";

  try {
    const { error } = await supabase.auth.signOut();

    if (error) {
      throw error;
    }

    window.location.href = "auth.html";

  } catch (error) {
    console.error("Logout error:", error);

    showStatus(
      "Unable to log out: " + error.message,
      true
    );

    signOutButton.disabled = false;
    signOutButton.textContent = "Log out";
  }
});

/* Start the dashboard. */
loadDashboard();

</script>

</body>
</html>
