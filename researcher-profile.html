<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061827">
  <meta name="description" content="Researcher profile at VOC Research World. Explore the research background, academic affiliation and ORCID information of our research community.">
  <title>Researcher Profile | VOC Research World</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .rp-page {
      min-height: 65vh;
      padding: 55px 0 75px;
      background: #f3f8fc;
      color: #203446;
    }

    .rp-wrap {
      width: min(950px, 92%);
      margin: auto;
    }

    .rp-card {
      overflow: hidden;
      border: 1px solid #dfe9f0;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(6,24,39,.06);
    }

    .rp-banner {
      height: 155px;
      background:
        radial-gradient(circle at 85% 20%, rgba(96,210,214,.25), transparent 30%),
        linear-gradient(125deg, #061827, #10425b);
    }

    .rp-content {
      padding: 0 35px 35px;
    }

    .rp-avatar {
      display: grid;
      width: 112px;
      height: 112px;
      margin-top: -56px;
      place-items: center;
      overflow: hidden;
      border: 5px solid white;
      border-radius: 50%;
      background: #e8f5fc;
      color: #1687c9;
      font-size: 2.5rem;
      font-weight: 800;
    }

    .rp-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rp-name {
      margin: 20px 0 7px;
      color: #061827;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.2;
    }

    .rp-position {
      margin: 0;
      color: #1687c9;
      font-weight: 800;
    }

    .rp-affiliation {
      margin-top: 9px;
      color: #64748b;
      line-height: 1.7;
    }

    .rp-divider {
      height: 1px;
      margin: 27px 0;
      background: #e5edf3;
    }

    .rp-section {
      margin-top: 25px;
    }

    .rp-section h2 {
      margin: 0 0 12px;
      color: #061827;
      font-size: 1.2rem;
    }

    .rp-bio {
      color: #526579;
      line-height: 1.9;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .rp-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .rp-detail {
      padding: 16px;
      border: 1px solid #e1ebf2;
      border-radius: 10px;
      background: #f8fbfd;
      overflow-wrap: anywhere;
    }

    .rp-detail small {
      display: block;
      margin-bottom: 7px;
      color: #64748b;
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .rp-detail strong,
    .rp-detail a {
      color: #173d56;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .rp-orcid {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #16834b !important;
      font-weight: 800;
      text-decoration: none;
    }

    .rp-note {
      margin-top: 12px;
      color: #64748b;
      font-size: .82rem;
      line-height: 1.6;
    }

    .rp-message {
      padding: 25px;
      border: 1px dashed #b9cbd8;
      border-radius: 12px;
      background: white;
      color: #526579;
      line-height: 1.8;
      text-align: center;
    }

    .rp-back {
      display: inline-block;
      margin-bottom: 22px;
      color: #0879b7;
      font-weight: 800;
      text-decoration: none;
    }

    .rp-back:hover {
      text-decoration: underline;
    }

    .rp-link {
      color: #0879b7;
      font-weight: 700;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .rp-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .rp-page {
        padding: 35px 0 50px;
      }

      .rp-content {
        padding: 0 20px 25px;
      }

      .rp-details {
        grid-template-columns: 1fr;
      }

      .rp-banner {
        height: 125px;
      }
    }
  </style>
</head>

<body>
  <div id="header"></div>

  <main class="rp-page">
    <div class="rp-wrap">
      <a class="rp-back" href="authors.html">← Back to Authors & Researchers</a>

      <div id="researcherProfile" class="rp-message" aria-live="polite">
        Loading researcher profile…
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="app.js"></script>

  <script type="module">
    import { supabase } from "./supabase-config.js";

    const container = document.getElementById("researcherProfile");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function safeURL(value) {
      try {
        const url = new URL(value);
        return ["https:", "http:"].includes(url.protocol)
          ? url.href
          : "";
      } catch {
        return "";
      }
    }

    function normaliseORCID(value) {
      return String(value ?? "")
        .trim()
        .replace(/^https?:\/\/orcid\.org\//i, "")
        .replace(/[\s-]/g, "")
        .toUpperCase();
    }

    function validORCID(value) {
      const id = normaliseORCID(value);

      if (!/^\d{15}[\dX]$/.test(id)) return false;

      let total = 0;

      for (let i = 0; i < 15; i++) {
        total = (total + Number(id[i])) * 2;
      }

      const remainder = total % 11;
      const result = (12 - remainder) % 11;
      const checksum = result === 10 ? "X" : String(result);

      return checksum === id[15];
    }

    function formatORCID(value) {
      const id = normaliseORCID(value);
      return id.match(/.{1,4}/g)?.join("-") || "";
    }

    function showMessage(message) {
      container.className = "rp-message";
      container.textContent = message;
    }

    function renderProfile(profile) {
      const name = escapeHTML(profile.full_name || "Researcher");
      const position = escapeHTML(profile.position || profile.role || "Research Contributor");
      const department = escapeHTML(profile.department || "Not provided");
      const affiliation = escapeHTML(profile.affiliation || "Not provided");
      const country = escapeHTML(profile.country || "Not provided");
      const bio = escapeHTML(profile.bio || "No biography has been provided yet.");

      const imageURL = safeURL(profile.profile_image_url);
      const websiteURL = safeURL(profile.website_url);

      const initials = String(profile.full_name || "R")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part.charAt(0))
        .join("")
        .toUpperCase();

      let orcidHTML = '<span>Not provided</span>';

      if (profile.orcid_id) {
        if (validORCID(profile.orcid_id)) {
          const formatted = formatORCID(profile.orcid_id);
          const orcidURL = "https://orcid.org/" + formatted;

          orcidHTML =
            '<a class="rp-orcid" href="' + escapeHTML(orcidURL) +
            '" target="_blank" rel="noopener noreferrer">' +
            '<span>●</span> ' + escapeHTML(formatted) +
            '</a>' +
            '<p class="rp-note">ORCID iD supplied on this profile. Its ownership has not been independently verified by VOC Research World.</p>';
        } else {
          orcidHTML =
            '<span>ORCID iD requires correction</span>';
        }
      }

      const websiteHTML = websiteURL
        ? '<a class="rp-link" href="' + escapeHTML(websiteURL) +
          '" target="_blank" rel="noopener noreferrer">Visit website ↗</a>'
        : '<span>Not provided</span>';

      container.className = "rp-card";

      container.innerHTML = `
        <div class="rp-banner"></div>

        <div class="rp-content">
          <div class="rp-avatar">
            ${imageURL
              ? '<img src="' + escapeHTML(imageURL) + '" alt="' + name + '">'
              : escapeHTML(initials)}
          </div>

          <h1 class="rp-name">${name}</h1>
          <p class="rp-position">${position}</p>

          <p class="rp-affiliation">
            ${affiliation}
          </p>

          <div class="rp-divider"></div>

          <section class="rp-section">
            <h2>Researcher Biography</h2>
            <div class="rp-bio">${bio}</div>
          </section>

          <section class="rp-section">
            <h2>Academic Information</h2>

            <div class="rp-details">
              <div class="rp-detail">
                <small>Department</small>
                <strong>${department}</strong>
              </div>

              <div class="rp-detail">
                <small>Institution / Affiliation</small>
                <strong>${affiliation}</strong>
              </div>

              <div class="rp-detail">
                <small>Country</small>
                <strong>${country}</strong>
              </div>

              <div class="rp-detail">
                <small>ORCID iD</small>
                ${orcidHTML}
              </div>

              <div class="rp-detail">
                <small>Professional Website</small>
                ${websiteHTML}
              </div>
            </div>
          </section>

          <div class="rp-divider"></div>

          <p class="rp-note">
            This profile is displayed according to the researcher's public
            profile settings. Personal email addresses are not displayed here.
          </p>
        </div>
      `;
    }

    async function loadProfile() {
      const profileId = new URLSearchParams(window.location.search).get("id");

      if (!profileId) {
        showMessage("No researcher profile was specified. Please return to the Authors directory.");
        return;
      }

      try {
        const { data, error } = await supabase
          .from("profiles")
          .select(`
            id,
            full_name,
            affiliation,
            department,
            position,
            bio,
            profile_image_url,
            orcid_id,
            country,
            website_url,
            role,
            is_public
          `)
          .eq("id", profileId)
          .eq("is_public", true)
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          showMessage("This researcher profile is unavailable or has not been made public.");
          return;
        }

        renderProfile(data);

        document.title =
          (data.full_name || "Researcher") +
          " | VOC Research World";

      } catch (error) {
        console.error("Researcher profile loading error:", error);
        showMessage("We could not load this researcher profile right now. Please try again later.");
      }
    }

    loadProfile();
  </script>
</body>
</html>
