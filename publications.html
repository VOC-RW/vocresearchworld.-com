<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications | VOC Research World</title>
  <link rel="stylesheet" href="style.css">
</head><body>
  <div id="header"></div>  <section class="page">
    <div class="wrap">
      <p class="eyebrow">PUBLICATION LIBRARY</p>
      <h1>Published scientific research.</h1>
      <p>Explore research approved for publication by VOC Research World.</p>
    </div>
  </section>  <section class="content">
    <div class="wrap">
      <div id="publicationStatus" role="status" class="small">
  Loading published research…
</div>

<div style="display:flex;gap:12px;flex-wrap:wrap;margin:18px 0;">
  <input
    id="publicationSearch"
    type="search"
    placeholder="Search title, author, keyword, or DOI…"
    aria-label="Search publications"
    style="flex:1;min-width:220px;padding:12px;border:1px solid #ccd3dc;border-radius:8px;"
  >

  <select
    id="publicationCategory"
    aria-label="Filter by research category"
    style="min-width:200px;padding:12px;border:1px solid #ccd3dc;border-radius:8px;"
  >
    <option value="">All research categories</option>
  </select>
</div>

<div id="publicationResults" class="small" aria-live="polite"></div>

<div class="cards three" id="publicationGrid"></div>
    </div>
  </section>  <div id="footer"></div>  <script src="app.js"></script>  <script type="module">
    import { supabase } from './supabase-config.js';

    const grid = document.getElementById('publicationGrid');
    const status = document.getElementById('publicationStatus');

    const esc = value =>
      String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[character]));

    async function loadPublications() {
      status.textContent = 'Loading published research…';

      const { data, error } = await supabase
        .from('publications')
        .select(
          'id,title,slug,abstract,publication_date,doi,pdf_url,featured,categories(name)'
        )
        .eq('status', 'published')
        .order('publication_date', { ascending: false });

      if (error) {
        console.error('Publication loading error:', error);
        status.textContent =
          'Published research could not be loaded. Please try again later.';
        return;
      }

      if (!data || data.length === 0) {
        status.textContent = 'No journal submissions have been published yet.';
        return;
      }

      const publicationIds = data.map(publication => publication.id);

      const { data: authorRows, error: authorError } = await supabase
        .from('publication_authors')
        .select('publication_id,author_order,profiles(full_name,affiliation)')
        .in('publication_id', publicationIds)
        .order('author_order', { ascending: true });

      const authorsByPublication = {};

      if (!authorError && authorRows) {
        authorRows.forEach(author => {
          const name = author.profiles?.full_name;

          if (name) {
            (authorsByPublication[author.publication_id] ??= []).push(name);
          }
        });
      }

      const cards = await Promise.all(
        data.map(async publication => {
          const authors =
            authorsByPublication[publication.id]?.join(', ') ||
            'Author information pending';

          const date = publication.publication_date
            ? new Date(
                publication.publication_date + 'T00:00:00'
              ).toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
              })
            : 'Publication date pending';

          let paperUrl = '';

if (publication.pdf_url) {
  try {
    const storedValue = publication.pdf_url.trim();
    let objectPath = '';

    if (
      storedValue.startsWith(
        'https://wngsqgjkendxqmlgwvjy.supabase.co/storage/v1/object/'
      )
    ) {
      const originalUrl = new URL(storedValue);
      const marker = '/storage/v1/object/';
      const markerPosition = originalUrl.pathname.indexOf(marker);

      if (markerPosition >= 0) {
        const remainingPath = originalUrl.pathname.slice(
          markerPosition + marker.length
        );

        objectPath = decodeURIComponent(
          remainingPath.replace(/^sign\//, '').replace(/^public\//, '')
        );

        if (objectPath.startsWith('manuscripts/')) {
          objectPath = objectPath.slice('manuscripts/'.length);
        }
      }
    } else if (
      storedValue.startsWith('http://') ||
      storedValue.startsWith('https://')
    ) {
      paperUrl = storedValue;
    } else {
      objectPath = storedValue;
    }

    if (objectPath) {
      const { data: signedData, error: signedError } =
        await supabase.storage
          .from('manuscripts')
          .createSignedUrl(objectPath, 3600);

      if (signedError) {
        console.error(
          'Could not create manuscript access link:',
          signedError
        );
      } else if (signedData?.signedUrl) {
        paperUrl = signedData.signedUrl;
      }
    }
  } catch (error) {
    console.error('Could not prepare manuscript link:', error);
  }
        }

          const abstractHtml = publication.abstract
            ? `<details>
                 <summary>Read abstract</summary>
                 <p>${esc(publication.abstract)}</p>
               </details>`
            : '<p>Abstract not available.</p>';

          const paperHtml = paperUrl
            ? `<p>
                 <a class="btn primary"
                    href="${esc(paperUrl)}"
                    target="_blank"
                    rel="noopener noreferrer">
                   Read full paper
                 </a>
               </p>`
            : `<p class="small">
                 Full-text access is not available right now.
                 Please try again later.
               </p>`;

          return `
            <article class="card">
              <label>
                ${esc(publication.categories?.name || 'Research Article')}
                · PUBLISHED
              </label>

              <h3>${esc(publication.title)}</h3>

              <p class="small">${esc(authors)}</p>

              <p class="small">
                ${esc(date)}
                ${
                  publication.doi
                    ? ' · DOI: ' + esc(publication.doi)
                    : ''
                }
              </p>

              ${abstractHtml}

              ${paperHtml}
            </article>
          `;
        })
      );

      grid.innerHTML = cards.join('');

      status.textContent =
        data.length +
        ' published ' +
        (data.length === 1 ? 'article' : 'articles');
    }

    loadPublications().catch(error => {
      console.error('Unexpected publication page error:', error);
      status.textContent =
        'An unexpected error occurred while loading publications.';
    });
  </script></body>
  </html>
