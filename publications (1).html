<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publications | VOC Research World</title><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><section class="page"><div class="wrap"><p class="eyebrow">PUBLICATION LIBRARY</p><h1>Scientific publications and research notes.</h1><p>A developing library in which each publication can be connected to its authors, article record, project and identifier.</p></div></section><section class="content"><div class="wrap cards three" id="publicationGrid"></div></section><div id="footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const selected=new URLSearchParams(location.search).get('id'); const list=selected?[publication(selected)]:Object.values(VOC_PUBLICATIONS); document.getElementById('publicationGrid').innerHTML=list.map(p=>{const names=p.authors.map(id=>author(id).name).join(', ');return `<article><label>${esc(p.type)} · ${p.year}</label><h3>${esc(p.title)}</h3><p>${esc(names)}</p><p class="small">${esc(p.status)} · ${esc(p.identifier)}</p><p><a href="article.html?id=${encodeURIComponent(p.articleId)}">Article →</a> &nbsp; <a href="project.html?id=${encodeURIComponent(p.projectId)}">Project →</a></p></article>`}).join('');
</script></body></html>
