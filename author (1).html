<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author Profile | VOC Research World</title><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><section class="content"><div class="wrap split"><div class="lab"><div><strong id="initials">VOC</strong><small>RESEARCH PROFILE</small></div></div><div><p class="eyebrow">AUTHOR PROFILE</p><h1 id="name"></h1><p id="role"></p><p id="bio"></p><p><b>Affiliation:</b> <span id="affiliation"></span></p><h2>Research interests</h2><p id="interests"></p><p><a href="authors.html">← All authors</a></p></div></div></section><section class="content"><div class="wrap"><h2>Articles by this author</h2><div class="cards three" id="articles"></div><h2>Research projects</h2><div class="cards three" id="projects"></div></div></section><div id="footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const a=author(new URLSearchParams(location.search).get('id')||'editorial'); document.title=a.name+' | VOC Research World';
document.getElementById('initials').textContent=a.initials; document.getElementById('name').textContent=a.name; document.getElementById('role').textContent=a.role; document.getElementById('bio').textContent=a.bio; document.getElementById('affiliation').textContent=a.affiliation; document.getElementById('interests').textContent=a.interests.join(' · ');
document.getElementById('articles').innerHTML=a.articles.map(id=>articleCard(article(id))).join('')||'<p>No articles listed yet.</p>';
document.getElementById('projects').innerHTML=a.projects.map(id=>{const p=project(id);return `<article><label>${esc(p.status)}</label><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><a href="project.html?id=${encodeURIComponent(id)}">View project →</a></article>`}).join('')||'<p>No projects listed yet.</p>';
</script></body></html>
